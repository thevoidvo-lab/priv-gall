name: Build DvvLog APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Ekstrak ZIP
    - name: Unzip Project
      run: |
        ZIP_FILE=$(find . -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -o "$ZIP_FILE" -d extracted
          cp -r extracted/* .
          rm -rf extracted
          rm "$ZIP_FILE"
        fi

    # 2. Bersihin file dari ZIP biar ga nimpa config kita
    - name: Bersihin File GitHub dari ZIP
      run: |
        rm -f .github/workflows/build.yml
        find . -name "settings.gradle.kts" -delete
        find . -name "build.gradle.kts" -delete

    # 3. Cari Root Project
    - name: Find Project Root
      id: find
      run: |
        SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
        if [ -z "$SETTINGS_FILE" ]; then exit 1; fi
        DIR=$(dirname "$SETTINGS_FILE")
        echo "path=$DIR" >> $GITHUB_OUTPUT

    # 4. Setup JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 5. Overwrite Config (Groovy + Fix buildDir deprecated)
    - name: Overwrite settings.gradle
      working-directory: ${{ steps.find.outputs.path }}
      run: |
        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "DvvLog"
        include ':app'
        EOF

    - name: Overwrite root build.gradle
      working-directory: ${{ steps.find.outputs.path }}
      run: |
        cat > build.gradle << 'EOF'
        buildscript {
            ext {
                kotlin_version = '2.0.21'
            }
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.7.2'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
                classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
            }
        }
        // FIX: Ganti buildDir ke layout.buildDirectory
        tasks.register('clean', Delete) {
            delete rootProject.layout.buildDirectory
        }
        EOF

    # 6. Generate debug.keystore
    - name: Generate debug.keystore
      working-directory: ${{ steps.find.outputs.path }}
      run: |
        mkdir -p app
        keytool -genkeypair -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # 7. Setup Gradle 8.9
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 8.9

    # 8. Build APK
    - name: Build APK
      working-directory: ${{ steps.find.outputs.path }}
      run: gradle clean assembleDebug --stacktrace

    # 9. Upload APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DvvLog-Debug-APK
        path: ${{ steps.find.outputs.path }}/app/build/outputs/apk/debug/app-debug.apk
