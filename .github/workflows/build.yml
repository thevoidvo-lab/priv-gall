name: Build Private Vault APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Unzip
    - name: Unzip Project
      run: |
        ZIP_FILE=$(find . -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Ekstrak file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted
          cp -r extracted/* .
          rm -rf extracted
          rm "$ZIP_FILE"
        fi

    # 2. Cari Folder Project (yang ada folder 'app' dan 'settings.gradle')
    - name: Cari Project Root
      id: find
      run: |
        # Cari file settings.gradle, terus ambil folder parent-nya
        SETTINGS_FILE=$(find . -name "settings.gradle" | head -n 1)
        if [ -z "$SETTINGS_FILE" ]; then
          echo "Error: settings.gradle ga ketemu. Cek struktur zip lo."
          find . -maxdepth 3 -type d
          exit 1
        fi
        DIR=$(dirname "$SETTINGS_FILE")
        echo "path=$DIR" >> $GITHUB_OUTPUT
        echo "Project root ditemukan di: $DIR"
        echo "Isi folder project:"
        ls -la "$DIR"

    # 3. JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 4. Overwrite settings.gradle
    - name: Overwrite settings.gradle
      working-directory: ${{ steps.find.outputs.path }}
      run: |
        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "PrivateVault"
        include ':app'
        EOF

    # 5. Overwrite root build.gradle
    - name: Overwrite root build.gradle
      working-directory: ${{ steps.find.outputs.path }}
      run: |
        cat > build.gradle << 'EOF'
        buildscript {
            ext {
                compose_version = '1.5.14'
                kotlin_version = '1.9.24'
            }
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.5.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
                classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        tasks.register('clean', Delete) {
            delete rootProject.buildDir
        }
        EOF

    # 6. Bikin folder 'app' & Overwrite app/build.gradle
    - name: Setup app folder and build.gradle
      working-directory: ${{ steps.find.outputs.path }}
      run: |
        # Pastiin folder app ada
        mkdir -p app
        
        cat > app/build.gradle << 'EOF'
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
            id 'org.jetbrains.kotlin.plugin.compose'
            id 'kotlin-kapt'
        }

        android {
            namespace 'com.example.privatevault'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.privatevault"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
                vectorDrawables { useSupportLibrary true }
            }

            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
            buildFeatures { compose true }
            packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2024.02.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.ui:ui-graphics'
            implementation 'androidx.compose.ui:ui-tooling-preview'
            implementation 'androidx.compose.material3:material3'
            implementation 'androidx.compose.material:material-icons-extended'
            implementation 'androidx.room:room-runtime:2.6.1'
            implementation 'androidx.room:room-ktx:2.6.1'
            kapt 'androidx.room:room-compiler:2.6.1'
            implementation 'androidx.security:security-crypto:1.1.0-alpha06'
            implementation 'io.coil-kt:coil-compose:2.6.0'
            implementation 'androidx.media3:media3-exoplayer:1.2.1'
            implementation 'androidx.media3:media3-ui:1.2.1'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        }
        EOF

    # 7. Keystore
    - name: Generate debug.keystore
      working-directory: ${{ steps.find.outputs.path }}
      run: |
        mkdir -p app
        keytool -genkeypair -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # 8. Build
    - name: Grant execute permission for gradlew
      working-directory: ${{ steps.find.outputs.path }}
      run: |
        if [ -f gradlew ]; then chmod +x gradlew; fi

    - name: Build with Gradle
      working-directory: ${{ steps.find.outputs.path }}
      run: |
        if [ -f gradlew ]; then ./gradlew assembleDebug --stacktrace; else gradle assembleDebug --stacktrace; fi

    # 9. Upload
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PrivateVault-Debug-APK
        path: ${{ steps.find.outputs.path }}/app/build/outputs/apk/debug/app-debug.apk
