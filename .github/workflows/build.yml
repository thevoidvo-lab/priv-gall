name: Build Private Vault APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 1. Nulis ulang settings.gradle
    - name: Overwrite settings.gradle
      run: |
        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "PrivateVault"
        include ':app'
        EOF

    # 2. Nulis ulang root build.gradle
    - name: Overwrite root build.gradle
      run: |
        cat > build.gradle << 'EOF'
        buildscript {
            ext {
                compose_version = '1.5.14'
                kotlin_version = '1.9.24'
            }
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.5.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
                classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        tasks.register('clean', Delete) {
            delete rootProject.buildDir
        }
        EOF

    # 3. Nulis ulang app/build.gradle
    - name: Overwrite app/build.gradle
      run: |
        cat > app/build.gradle << 'EOF'
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
            id 'org.jetbrains.kotlin.plugin.compose'
            id 'kotlin-kapt'
        }

        android {
            namespace 'com.example.privatevault'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.privatevault"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
                vectorDrawables { useSupportLibrary true }
            }

            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
            buildFeatures { compose true }
            packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2024.02.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.ui:ui-graphics'
            implementation 'androidx.compose.ui:ui-tooling-preview'
            implementation 'androidx.compose.material3:material3'
            implementation 'androidx.compose.material:material-icons-extended'
            implementation 'androidx.room:room-runtime:2.6.1'
            implementation 'androidx.room:room-ktx:2.6.1'
            kapt 'androidx.room:room-compiler:2.6.1'
            implementation 'androidx.security:security-crypto:1.1.0-alpha06'
            implementation 'io.coil-kt:coil-compose:2.6.0'
            implementation 'androidx.media3:media3-exoplayer:1.2.1'
            implementation 'androidx.media3:media3-ui:1.2.1'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        }
        EOF

    # 4. Generate debug keystore buat signing
    - name: Generate debug.keystore
      run: |
        keytool -genkeypair -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # 5. Build APK
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    # 6. Upload Artifact
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PrivateVault-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
