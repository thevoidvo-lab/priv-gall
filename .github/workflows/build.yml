name: Build DvvLog APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Ekstrak ZIP
    - name: Unzip Project
      run: |
        ZIP_FILE=$(find . -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -o "$ZIP_FILE" -d extracted
          cp -r extracted/* .
          rm -rf extracted
          rm "$ZIP_FILE"
        fi

    # 2. Cari Root Project
    - name: Find Project Root
      id: find
      run: |
        SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
        if [ -z "$SETTINGS_FILE" ]; then
          echo "path=." >> $GITHUB_OUTPUT
        else
          DIR=$(dirname "$SETTINGS_FILE")
          echo "path=$DIR" >> $GITHUB_OUTPUT
        fi

    # 3. Setup JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 4. Timpa Semua Config (Root & App)
    - name: Force Create Gradle Config
      working-directory: ${{ steps.find.outputs.path }}
      run: |
        # Hapus file .kts bawaan Grok biar ga dobel
        rm -f settings.gradle.kts
        rm -f build.gradle.kts
        rm -f app/build.gradle.kts
        
        # Timpa settings.gradle (Groovy)
        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "DvvLog"
        include ':app'
        EOF

        # Timpa root build.gradle (Groovy)
        cat > build.gradle << 'EOF'
        import org.gradle.api.tasks.Delete
        buildscript {
            ext { kotlin_version = '2.0.21' }
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.7.2'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
                classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
            }
        }
        tasks.register('clean', Delete) { delete rootProject.layout.buildDirectory }
        EOF

        # Timpa app/build.gradle (Groovy) + TAMBAH MATERIAL ICONS
        mkdir -p app
        cat > app/build.gradle << 'EOF'
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
            id 'org.jetbrains.kotlin.plugin.compose'
        }

        android {
            namespace 'com.dvvlog'
            compileSdk 35

            defaultConfig {
                applicationId "com.dvvlog"
                minSdk 26
                targetSdk 35
                versionCode 1
                versionName "1.0"
            }

            buildFeatures { compose = true }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
        }

        dependencies {
            def composeBom = platform('androidx.compose:compose-bom:2024.10.01')
            implementation composeBom
            implementation 'androidx.core:core-ktx:1.15.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
            implementation 'androidx.activity:activity-compose:1.9.3'
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.ui:ui-tooling-preview'
            implementation 'androidx.compose.material3:material3'
            implementation 'androidx.compose.material:material-icons-extended'
            implementation 'androidx.compose.foundation:foundation'
            implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
            implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
            implementation 'org.nanohttpd:nanohttpd:2.3.1'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
        }
        EOF

    # 5. Download gradle-wrapper.jar
    - name: Download gradle-wrapper.jar
      working-directory: ${{ steps.find.outputs.path }}
      run: |
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar

    # 6. Setup Gradle 8.9
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 8.9

    # 7. Build APK
    - name: Build APK
      working-directory: ${{ steps.find.outputs.path }}
      run: gradle clean assembleDebug --stacktrace

    # 8. Upload APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DvvLog-Debug-APK
        path: ${{ steps.find.outputs.path }}/app/build/outputs/apk/debug/app-debug.apk
